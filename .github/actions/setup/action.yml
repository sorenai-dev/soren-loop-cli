name: setup
description: >-
  Check out the sibling soren-loop repo for the linked @sorenai/loop-schema, then install pnpm,
  Node from .nvmrc and dependencies. Expects this repo checked out at ./soren-loop-cli.
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: sorenai-dev/soren-loop
        path: soren-loop
        persist-credentials: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: soren-loop-cli/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: soren-loop-cli/.nvmrc
        cache: pnpm
        cache-dependency-path: soren-loop-cli/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: soren-loop-cli
